# Portainer-Stack: Vincent Hellmann Website
#
# Voraussetzungen:
#  - Externes Docker-Netzwerk "edge" (dort läuft Traefik)
#  - Nginx Proxy Manager leitet vincent-hellmann.com an Traefik weiter
#    (TLS terminiert im NPM)
#  - Umgebungsvariablen im Stack setzen (siehe .env.example)
#
# ── Die drei Domains ────────────────────────────────────────────────────────
#
# Vincent hat .com, .de und .fr. Maßgeblich ist **eine** davon:
# https://vincent-hellmann.com. Alles andere leitet dorthin um.
#
# Die Umleitung passiert im Nginx Proxy Manager und **nicht** hier. Der Grund
# ist nüchtern: Eine Umleitung ist eine Kopfzeile, keine Rechenaufgabe. Im NPM
# kostet sie einen Redirection Host je Domain und endet dort; über Traefik
# gedreht liefe jeder Aufruf von .de und .fr erst durch die ganze Kette, nur
# um dann doch eine Zeile Antwort zu bekommen.
#
#   NPM: vincent-hellmann.com     → Proxy Host   → Traefik → diese Container
#        vincent-hellmann.de      → Redirect 301 → https://vincent-hellmann.com
#        vincent-hellmann.fr      → Redirect 301 → https://vincent-hellmann.com
#        www.vincent-hellmann.*   → Redirect 301 → https://vincent-hellmann.com
#
# Traefik kennt deshalb nur die eine Adresse. Taucht hier trotzdem eine andere
# auf, antwortet Traefik mit 404 — das ist Absicht: ein sichtbarer Fehler ist
# besser als dieselbe Seite unter vier Adressen, die Google gegeneinander
# ausspielt.
#
# Wer gleich mehrere Domains bis hierher durchreichen will, setzt DOMAIN auf
# eine Traefik-Regel mit mehreren Hosts — siehe .env.example.
#
# Wichtig für den Proxy-Host im NPM:
#  - client_max_body_size auf 512m (die Übergabemappe nimmt 500-MB-Dateien an;
#    ohne das endet der Upload mit 413, bevor überhaupt etwas ankommt)
#  - Websockets aktivieren (die Live-Verbindung des Büros unter /ws/buero)
#  - X-Forwarded-Proto muss https sein, sonst baut die Anwendung http-Links
#
# ── Ausrollen über Portainer aus dem Repository (GitOps) ───────────────────
#
# Der Stack kommt direkt aus diesem Repo — kein Webhook, kein Zwischenglied:
#
#   Build method:          Repository
#   Repository URL:        https://github.com/DomCim/vh-website
#                          (öffentlich — Authentication bleibt aus)
#   Repository reference:  refs/heads/betrieb      ← NICHT main!
#   Compose path:          docker-compose.yml
#   GitOps updates:        an, Polling (5 Minuten reichen)
#   Re-pull image:         an — sonst bleibt trotz neuem Stand das alte
#                          Abbild im Einsatz
#   Environment variables: von Hand eintragen (Advanced mode, Werte aus der
#                          bisherigen Stack-Konfiguration). Pflicht sind
#                          PAYLOAD_SECRET und POSTGRES_PASSWORD; der Rest
#                          steht in .env.example. KEIN stack.env ins Repo —
#                          es ist öffentlich.
#
# Warum `betrieb` und nicht `main`: Portainer pollt das Repo, die Abbilder
# werden aber erst NACH dem Push auf main gebaut. Wer main pollt, erwischt
# regelmäßig den Moment dazwischen, zieht die alten Abbilder — und bleibt
# darauf stehen. Der Workflow schiebt den Branch `betrieb` deshalb erst
# weiter, wenn beide Abbilder fertig im Regal liegen (docker.yml, Job
# „ausrollen").
#
# Beim Umzug vom alten Stack: erst den alten Stack löschen (die Volumes
# bleiben dabei liegen), dann diesen unter EXAKT demselben Namen anlegen —
# die Volumes heißen <Stackname>_media, _dbdata, _backups und docken nur bei
# gleichem Namen wieder an. Der frühere Umweg über einen Home-Assistant-
# Webhook ist mit dem Umzug hierher entfallen (kein GitHub-Secret mehr,
# kein eigener Schritt im Workflow).
services:
  web:
    # Zwei Abbilder aus demselben Quelltext: Dieses hier enthält Website, Shop
    # und Admin-Panel, das andere das Büro. Gebaut wird nur, was sich geändert
    # hat — eine reine Büro-Änderung erzeugt gar kein neues Website-Abbild, und
    # dieser Container hat beim Ausrollen dann nichts zu tun.
    image: ghcr.io/domcim/vh-website:${VH_FASSUNG_WEB:-${VH_FASSUNG:-latest}}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dieser Container bedient die Website und erledigt alles, was es genau
      # einmal geben darf: Migrationen, Startdaten, nächtliche Sicherung,
      # Erinnerungen, Postfach-Blick.
      ROLLE: web
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://vincent-hellmann.com}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET muss gesetzt sein}
      DATABASE_URI: postgres://${POSTGRES_USER:-vh}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/${POSTGRES_DB:-vh}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Vincent Hellmann}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      FB_PAGE_ID: ${FB_PAGE_ID:-}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN:-}
      IG_ACCOUNT_ID: ${IG_ACCOUNT_ID:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-false}
      # Schlüssel für den MCP-Endpunkt (leer = deaktiviert)
      MCP_API_KEY: ${MCP_API_KEY:-}
      # Der Nur-Lese-Schlüssel stand in .env.example und README, wurde hier
      # aber nie durchgereicht — im Container blieb nur der Weg über den Admin
      MCP_READONLY_API_KEY: ${MCP_READONLY_API_KEY:-}
      # Nur nötig, wenn Wartung und Postfach zusätzlich von außen angestoßen
      # werden sollen (z.B. aus Home Assistant). Den Takt hält der Server
      # selbst; eingestellt wird er im Admin unter Integrationen → Takt.
      CRON_SECRET: ${CRON_SECRET:-}
      # Zugangsdaten der Datenbank für pg_dump (Sicherung)
      POSTGRES_USER: ${POSTGRES_USER:-vh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-vh}
      # Herkunft einer **fremden** Besucherstatistik für die
      # Sicherheitsrichtlinie (CSP), z.B. https://plausible.io. Für die eigene
      # Zählung nicht nötig: Die läuft über /js/zaehler.js auf dieser Domain
      # und ist damit 'self'.
      CSP_EXTRA_SCRIPT: ${CSP_EXTRA_SCRIPT:-}
      # Eigene Besucherzählung — normalerweise im Admin unter Integrationen
      # gepflegt, hier nur als Notweg. Siehe docker-compose.statistik.yml.
      PLAUSIBLE_URL: ${PLAUSIBLE_URL:-}
      PLAUSIBLE_SITE: ${PLAUSIBLE_SITE:-}
      PLAUSIBLE_API_KEY: ${PLAUSIBLE_API_KEY:-}
      # Beim allerersten Start auf "true" setzen, um Startdaten einzuspielen
      SEED: ${SEED:-false}
      # Einmalig auf "true" setzen, um die englischen Übersetzungen
      # der Seed-Inhalte einzuspielen — danach wieder auf "false"
      TRANSLATE_EN: ${TRANSLATE_EN:-false}
    volumes:
      # Persistente Uploads (Bilder aus dem Admin-Panel)
      - media:/app/media
      # Fertige Sicherungen (Datenbank + Medien in einem Archiv). Die App legt
      # sie hier ab und schiebt sie auf die NAS — siehe Büro → Sicherung.
      - backups:/app/backups
    networks:
      - edge
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.vhweb.rule=Host(`${DOMAIN:-vincent-hellmann.com}`)
      - traefik.http.routers.vhweb.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      # Niedrigere Priorität als das Büro: Bei zwei passenden Regeln gewinnt
      # die höhere, und /office soll ausdrücklich beim Büro landen.
      #
      # Warum die Zahl so groß ist: Ohne Angabe vergibt Traefik die Priorität
      # nach der *Länge der Regel*. `Host(`vincent-hellmann.com`)` allein kommt
      # damit auf 27. Wer hier 1 und 10 einträgt, stellt seine beiden Router
      # also hinter jeden anderen, der keine Angabe macht — etwa einen
      # übriggebliebenen Container aus dem vorigen Stack. Der bediente dann
      # weiter alles, auch /office, und man sieht den alten Stand.
      - traefik.http.routers.vhweb.priority=100
      - traefik.http.services.vhweb.loadbalancer.server.port=3000
      # ── Ratenbremse als zweite Schicht ─────────────────────────────────
      #
      # Die Bremsen in der Anwendung sitzen nur an den heiklen Endpunkten
      # und leben im Speicher je Container. Diese hier fängt davor ab, was
      # die App gar nicht erst sehen soll: stumpfes Geflute auf beliebige
      # Adressen — auch die teuren wie die Suche (eine unauthentifizierte
      # LIKE-Abfrage auf die Datenbank) und die PDF-Routen.
      #
      # Die Werte sind je Besucher-IP und bewusst großzügig: Eine
      # Artikelseite lädt ein Dutzend Bilder und Skripte auf einen Schlag,
      # und zwei Leute hinter derselben Firmen-IP teilen sich ein Konto.
      # Ein Mensch erreicht 50/s nicht — ein Skript sofort.
      #
      # WICHTIG: `depth=1` liest die Besucher-IP aus X-Forwarded-For, das
      # der NPM setzt. Ohne das zählte Traefik alle Besucher auf die IP des
      # NPM zusammen — die Bremse träfe dann alle gleichzeitig oder nie.
      # Kommt je ein weiterer Proxy davor (z.B. Cloudflare), muss die Zahl
      # auf 2 hoch.
      - traefik.http.middlewares.vhweb-bremse.ratelimit.average=50
      - traefik.http.middlewares.vhweb-bremse.ratelimit.burst=100
      - traefik.http.middlewares.vhweb-bremse.ratelimit.sourcecriterion.ipstrategy.depth=1
      - traefik.http.middlewares.vhweb-gleichzeitig.inflightreq.amount=40
      - traefik.http.middlewares.vhweb-gleichzeitig.inflightreq.sourcecriterion.ipstrategy.depth=1
      - traefik.http.routers.vhweb.middlewares=vhweb-bremse,vhweb-gleichzeitig
    # Ein gefluteter Web-Container darf Datenbank und Büro nicht mit in den
    # Abgrund ziehen — die Trennung in zwei Container trägt nur mit Limits.
    mem_limit: 1g
    cpus: 2

  # ── Büro ────────────────────────────────────────────────────────────────
  #
  # Dasselbe Abbild, dieselbe Datenbank, dieselbe Adresse — nur ein eigener
  # Prozess. Der Grund ist nüchtern: Vorher teilten sich Shop und Büro einen
  # Prozess, und ein Fehler im Büro riss den Shop mit. Jetzt kann das Büro
  # abstürzen, neu starten oder ausgerollt werden, ohne dass ein Kunde etwas
  # merkt — und umgekehrt.
  #
  # Weil die Adresse dieselbe bleibt, gelten Anmeldung und Passkeys unverändert
  # für beide. Verbunden sind sie nur über die Datenbank: Änderungen laufen als
  # Postgres-Meldung hin und her, damit die Live-Verbindung im Büro auch
  # mitbekommt, was im Shop passiert.
  buero:
    image: ghcr.io/domcim/vh-buero:${VH_FASSUNG_BUERO:-${VH_FASSUNG:-latest}}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      # Kein Takt, keine Migrationen — die macht der Web-Container. Dafür hält
      # dieser hier die offenen Live-Verbindungen.
      ROLLE: buero
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://vincent-hellmann.com}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET muss gesetzt sein}
      DATABASE_URI: postgres://${POSTGRES_USER:-vh}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/${POSTGRES_DB:-vh}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Vincent Hellmann}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      # Zugangsdaten der Datenbank für pg_dump — die Sicherung lässt sich auch
      # aus dem Büro von Hand anstoßen
      POSTGRES_USER: ${POSTGRES_USER:-vh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-vh}
      CSP_EXTRA_SCRIPT: ${CSP_EXTRA_SCRIPT:-}
      # Das Büro liest die Zahlen unter /office/statistik
      PLAUSIBLE_URL: ${PLAUSIBLE_URL:-}
      PLAUSIBLE_SITE: ${PLAUSIBLE_SITE:-}
      PLAUSIBLE_API_KEY: ${PLAUSIBLE_API_KEY:-}
    volumes:
      # Dieselben Volumes wie die Website: Belege und Sicherungen sind
      # dieselben Dateien, nicht zwei Sätze davon.
      - media:/app/media
      - backups:/app/backups
    networks:
      - edge
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://localhost:3000/api/office/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      # Das Büro, seine eigenen Schnittstellen und die Live-Verbindung
      - traefik.http.routers.vhbuero.rule=Host(`${DOMAIN:-vincent-hellmann.com}`) && (PathPrefix(`/office`) || PathPrefix(`/api/office`) || PathPrefix(`/ws/buero`))
      - traefik.http.routers.vhbuero.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      # Höher als die Website — siehe die Erklärung dort
      - traefik.http.routers.vhbuero.priority=200
      - traefik.http.services.vhbuero.loadbalancer.server.port=3000
      # Dieselbe Bremse wie an der Website — siehe die Erklärung dort.
      # Etwas straffer, weil hinter /office keine anonyme Laufkundschaft
      # steht; die Live-Verbindungen (WebSocket) zählen in `inflightreq`
      # dauerhaft mit, deshalb nicht zu knapp: Handy, Tablet und Rechner
      # der Werkstatt hängen hinter derselben IP.
      - traefik.http.middlewares.vhbuero-bremse.ratelimit.average=30
      - traefik.http.middlewares.vhbuero-bremse.ratelimit.burst=60
      - traefik.http.middlewares.vhbuero-bremse.ratelimit.sourcecriterion.ipstrategy.depth=1
      - traefik.http.middlewares.vhbuero-gleichzeitig.inflightreq.amount=30
      - traefik.http.middlewares.vhbuero-gleichzeitig.inflightreq.sourcecriterion.ipstrategy.depth=1
      - traefik.http.routers.vhbuero.middlewares=vhbuero-bremse,vhbuero-gleichzeitig
    mem_limit: 1g
    cpus: 1.5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Die Datenbank bekommt ihr eigenes Dach — sie ist der eine Dienst, der
    # unter keinen Umständen verhungern darf, wenn ein Nachbar Amok läuft.
    mem_limit: 1g
    cpus: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-vh}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    external: true
  internal:

volumes:
  media:
  dbdata:
  backups:
