# Portainer-Stack: Vincent Hellmann Website
#
# Voraussetzungen:
#  - Externes Docker-Netzwerk "edge" (dort läuft Traefik)
#  - Nginx Proxy Manager leitet vh.dominikdill.com an Traefik weiter (TLS terminiert im NPM)
#  - Umgebungsvariablen im Stack setzen (siehe .env.example)
services:
  web:
    image: ghcr.io/domcim/vh-website:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://vh.dominikdill.com}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET muss gesetzt sein}
      DATABASE_URI: postgres://${POSTGRES_USER:-vh}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/${POSTGRES_DB:-vh}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Vincent Hellmann}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FB_PAGE_ID: ${FB_PAGE_ID:-}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN:-}
      IG_ACCOUNT_ID: ${IG_ACCOUNT_ID:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-false}
      # Schlüssel für den MCP-Endpunkt (leer = deaktiviert)
      MCP_API_KEY: ${MCP_API_KEY:-}
      # Nur nötig, wenn Wartung und Postfach zusätzlich von außen angestoßen
      # werden sollen (z.B. aus Home Assistant). Den Takt hält der Server
      # selbst; eingestellt wird er im Admin unter Integrationen → Takt.
      CRON_SECRET: ${CRON_SECRET:-}
      # Zugangsdaten der Datenbank für pg_dump (Sicherung)
      POSTGRES_USER: ${POSTGRES_USER:-vh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-vh}
      # Herkunft der Besucherstatistik für die Sicherheitsrichtlinie (CSP),
      # z.B. https://plausible.io — sonst blockt der Browser das Skript
      CSP_EXTRA_SCRIPT: ${CSP_EXTRA_SCRIPT:-}
      # Beim allerersten Start auf "true" setzen, um Startdaten einzuspielen
      SEED: ${SEED:-false}
      # Einmalig auf "true" setzen, um die englischen Übersetzungen
      # der Seed-Inhalte einzuspielen — danach wieder auf "false"
      TRANSLATE_EN: ${TRANSLATE_EN:-false}
    volumes:
      # Persistente Uploads (Bilder aus dem Admin-Panel)
      - media:/app/media
      # Fertige Sicherungen (Datenbank + Medien in einem Archiv). Die App legt
      # sie hier ab und schiebt sie auf die NAS — siehe Büro → Sicherung.
      - backups:/app/backups
    networks:
      - edge
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.vhweb.rule=Host(`${DOMAIN:-vh.dominikdill.com}`)
      - traefik.http.routers.vhweb.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.services.vhweb.loadbalancer.server.port=3000

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-vh}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    external: true
  internal:

volumes:
  media:
  dbdata:
  backups:
