# Portainer-Stack: Besucherzählung (Plausible)
#
# Ein **eigener** Stack, nicht Teil des Website-Stacks. Der Grund ist nüchtern:
# Die Website wird bei jedem Push neu ausgerollt, die Statistik so gut wie nie.
# Lägen beide zusammen, könnte ein Fehler in der Statistik das Ausrollen des
# Shops verhindern — und ein Ladengeschäft steht nicht still, weil der
# Besucherzähler hakt.
#
# ── Wie es zusammenhängt ────────────────────────────────────────────────────
#
# Plausible ist von außen **nicht** erreichbar: kein Traefik-Label, keine
# Portfreigabe, kein Zertifikat. Erreichbar ist es nur aus dem internen Netz
# des Website-Stacks. Das genügt, weil beides über die Website läuft:
#
#   Besucher → vincent-hellmann.com/js/zaehler.js  → Website → Plausible
#   Besucher → vincent-hellmann.com/api/zaehler    → Website → Plausible
#   Vincent  → vincent-hellmann.com/office/statistik → Büro  → Plausible
#
# Damit gibt es keine zweite Anmeldung, keine zweite Adresse und nichts, was
# ein Werbeblocker an seinem Namen erkennt.
#
# ── Vor dem ersten Start ────────────────────────────────────────────────────
#
# 1. Den Namen des internen Netzes des Website-Stacks heraussuchen:
#
#        docker network ls | grep internal
#
#    In Portainer heißt es nach dem Muster `<stackname>_internal`, bei einem
#    Stack namens „vh" also `vh_internal`. Diesen Namen unten als
#    WEBSITE_NETZ eintragen.
#
# 2. SECRET_KEY_BASE und TOTP_VAULT_KEY erzeugen (je einmal, dann behalten):
#
#        openssl rand -base64 48        # SECRET_KEY_BASE
#        openssl rand -base64 32        # TOTP_VAULT_KEY
#
# 3. Stack starten, https://vincent-hellmann.com ist noch nicht nötig.
#    Danach **einmalig** ein Konto anlegen. Weil Plausible von außen nicht
#    erreichbar ist, geht das über einen Tunnel vom eigenen Rechner:
#
#        ssh -L 8000:localhost:8000 server
#        # dann im Browser: http://localhost:8000
#
#    Dafür muss der Port kurz auf dem Server liegen — die Zeile `ports:` unten
#    einmal aktivieren, Konto und Website anlegen, API-Schlüssel erzeugen,
#    Zeile wieder auskommentieren, Stack neu ausrollen.
#
# 4. Im Admin der Website unter Integrationen → Besucherzählung eintragen:
#      Adresse      http://plausible:8000
#      Seite        vincent-hellmann.com
#      Schlüssel    der API-Schlüssel aus Schritt 3
#    Und in den Website-Einstellungen unter Besucherstatistik den Haken setzen.
#
# ── Was das kostet ──────────────────────────────────────────────────────────
#
# ClickHouse ist die schwerste Zutat und legt für sich allein gern 2 GB
# Arbeitsspeicher an. Zähmen lässt sich das (siehe unten) — aber erst, wenn
# der Stack überhaupt läuft.
#
# ── Sparsamer stellen (erst, wenn alles läuft) ──────────────────────────────
#
# Hier steht die nackte Fassung: Abbild, Volumes, Healthcheck. Kein Feintuning,
# keine Ulimits, keine eingebetteten Einstellungsdateien. Das ist Absicht — mit
# `depends_on: service_healthy` hält ein ClickHouse, das nicht hochkommt, den
# ganzen Stack auf, und dann sucht man den Fehler in vier Dingen gleichzeitig.
#
# Läuft der Stack, kann man ClickHouse an die kurze Leine nehmen. Dazu beim
# Dienst `plausible_events_db` ergänzen:
#
#     configs:
#       - source: clickhouse_sparsam
#         target: /etc/clickhouse-server/config.d/low-resources.xml
#
# und am Ende der Datei, auf oberster Ebene:
#
#     configs:
#       clickhouse_sparsam:
#         content: |
#           <clickhouse>
#               <mark_cache_size>524288000</mark_cache_size>
#               <profiles>
#                   <default>
#                       <max_threads>1</max_threads>
#                       <max_block_size>8192</max_block_size>
#                       <max_download_threads>1</max_download_threads>
#                       <input_format_parallel_parsing>0</input_format_parallel_parsing>
#                       <output_format_parallel_formatting>0</output_format_parallel_formatting>
#                   </default>
#               </profiles>
#           </clickhouse>
#
# Danach neu ausrollen und nachsehen, ob ClickHouse wieder „healthy" wird.
# Wird es das nicht, kann die Compose-Fassung von Portainer mit `content:`
# nichts anfangen — dann bleibt es eben bei der nackten Fassung. Sie läuft,
# sie braucht nur mehr Platz.
#
# Der Abschnitt heißt `profiles`, im Plural. Im Singular überliest ClickHouse
# ihn wortlos, und man wundert sich, warum das Sparen nichts bringt.
#
# Eine Einstellung, die hier früher stand, fehlt mit Absicht: die Umstellung
# auf reines IPv4. Das Abbild bringt sie längst selbst mit — es lauscht auf
# beiden Adressfamilien und verzeiht, wenn eine davon fehlt. Meine Fassung war
# eine Lösung für ein Problem, das es nicht mehr gibt.

services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3.0.1
    restart: unless-stopped
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    # Datenbanken anlegen, wandern lassen, starten — genau so steht es in der
    # Vorlage des Herstellers. Beim zweiten Start tun die ersten beiden nichts.
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      # Muss gesetzt sein, wird aber nur für Links in Mails gebraucht. Von
      # außen ist diese Adresse nicht erreichbar — das ist Absicht.
      BASE_URL: ${PLAUSIBLE_BASE_URL:-http://plausible:8000}
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE:?openssl rand -base64 48}
      TOTP_VAULT_KEY: ${PLAUSIBLE_TOTP_VAULT_KEY:?openssl rand -base64 32}
      # Nach dem ersten Konto zu: Es gibt nur einen, der hier hineinschaut.
      DISABLE_REGISTRATION: ${PLAUSIBLE_DISABLE_REGISTRATION:-true}
      DATABASE_URL: postgres://postgres:${PLAUSIBLE_DB_PASSWORT:?Passwort für die Statistik-Datenbank}@plausible_db:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible_events_db
    # Nur für die Ersteinrichtung (Schritt 3 oben) — danach wieder zu.
    # ports:
    #   - '127.0.0.1:8000:8000'
    volumes:
      - plausible-data:/var/lib/plausible
    networks:
      - statistik
      - website
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORT:?Passwort für die Statistik-Datenbank}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - statistik
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 10

  # ClickHouse — hier liegen die Seitenaufrufe.
  #
  # Bewusst nackt gehalten: Abbild, Volumes, Healthcheck, sonst nichts. Jede
  # Zusatzeinstellung ist eine weitere Stelle, an der der Start scheitern kann,
  # und ein Container, der nicht hochkommt, hält über `depends_on` den ganzen
  # Stack auf. Erst laufen lassen, dann feilen — siehe „Sparsamer stellen"
  # unten.
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
    networks:
      - statistik
    healthcheck:
      # **`127.0.0.1`, nicht `localhost`.** Daran hing der ganze Stack.
      #
      # Der Container hat kein IPv6, ClickHouse lauscht deshalb auf `0.0.0.0`.
      # `localhost` löst drinnen aber zuerst auf `::1` auf — die IPv6-Schleife.
      # Der Check klopfte also an eine Tür, die es nicht gibt, bekam
      # „Connection refused" und meldete die Datenbank als krank, während sie
      # tadellos lief. Plausible wartete per `depends_on` auf ein „gesund", das
      # nie kommen konnte, und das Ausrollen brach ab.
      #
      # Ein Healthcheck, der aus eigenem Unvermögen scheitert, ist schlimmer
      # als keiner: Er lässt den Fehler dort suchen, wo keiner ist.
      #
      # Gefragt wird mit `clickhouse-client`, dem Werkzeug des Abbilds selbst —
      # es *ist* dasselbe Programm wie der Server, nur anders gerufen, und kann
      # deshalb nicht fehlen. `SELECT 1` verrät zudem mehr als ein offener
      # Port: dass die Datenbank Abfragen annimmt und beantwortet. Genau darauf
      # wartet Plausible.
      test: ['CMD', 'clickhouse-client', '--host', '127.0.0.1', '--query', 'SELECT 1']
      # Reichlich Geduld beim ersten Start: ClickHouse legt sein Datenverzeichnis
      # an, und auf einer langsamen Platte dauert das. Läuft es einmal, ist der
      # Healthcheck in Sekunden durch — die Wartezeit kostet also nur einmal.
      start_period: 3m
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  # Unter sich: Plausible und seine beiden Datenbanken.
  statistik:
  # Die Brücke zum Website-Stack. Angelegt wird das Netz **dort**, hier wird
  # es nur mitbenutzt — deshalb `external`. So kann dieser Stack den anderen
  # nicht aufhalten: Fehlt das Netz, startet die Statistik nicht, die Website
  # läuft weiter.
  website:
    external: true
    name: ${WEBSITE_NETZ:-vh_internal}

volumes:
  db-data:
  event-data:
  event-logs:
  plausible-data:
