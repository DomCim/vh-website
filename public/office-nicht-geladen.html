<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ohne Netz — Vincent Hellmann Büro</title>
    <style>
      /*
       * Bewusst eine schlichte Seite ohne Anwendung dahinter.
       *
       * Sie erscheint, wenn ohne Netz eine Ansicht aufgerufen wird, die noch
       * nie offen war. Vorher wurde ersatzweise die übergeordnete Liste
       * ausgeliefert — unter der Adresse der Detailseite. Das sah aus wie ein
       * Fehler der Daten und war einer der Auslieferung: Wer einen Beleg
       * aufrief, bekam die Belegliste zu sehen und hielt sie für den Beleg.
       */
      :root {
        color-scheme: light dark;
        --papier: #f7f6f4;
        --tinte: #1d1d1f;
        --leise: #6b6b70;
        --bronze: #a86b3d;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--papier);
        color: var(--tinte);
        font: 1rem/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.6rem; }
      p { color: var(--leise); margin: 0 0 1.4rem; }
      a {
        display: inline-block;
        padding: 0.75rem 1.4rem;
        border-radius: 10px;
        background: var(--bronze);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
      @media (prefers-color-scheme: dark) {
        :root { --papier: #141416; --tinte: #f2f1ee; --leise: #9a9aa0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Diese Ansicht war noch nicht offen</h1>
      <p>
        Ohne Netz steht nur bereit, was schon einmal geladen wurde. Die Daten
        selbst liegen im Gerät — es fehlt nur diese Seite.
      </p>
      <a href="/office">Zur Übersicht</a>
    </main>
  </body>
</html>
