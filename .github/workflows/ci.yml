name: Prüfen (Typen, Lint, Build, Rauchtests)

# Läuft bewusst NICHT bei jedem Push.
#
# Actions-Minuten kosten Geld, und `push:` ohne Einschränkung hieß: jeder
# Commit auf jedem Arbeitszweig ein voller Lauf mit Postgres, Build und
# Browser-Tests — bei einem Arbeitstag mit zehn Commits zehn Läufe, von denen
# neun niemand ansieht. Das Kontingent war davon aufgebraucht.
#
# Geprüft wird stattdessen, wo es zählt: am Pull Request (dort steht das
# Ergebnis vor dem Merge — HANDOVER: „CI abwarten, nicht vorher mergen"),
# auf main nach dem Merge, und von Hand, wenn man es zwischendurch wissen
# will. Lokal läuft dieselbe Strecke mit `pnpm typecheck && pnpm lint &&
# pnpm exec playwright test`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ein neuer Stand bricht den laufenden Lauf desselben Zweigs ab — der alte
# prüft etwas, das es schon nicht mehr gibt, und kostet trotzdem Minuten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vh
          POSTGRES_PASSWORD: vh
          POSTGRES_DB: vh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://vh:vh@localhost:5432/vh
      PAYLOAD_SECRET: nur-fuer-die-pruefung
      MCP_API_KEY: nur-fuer-die-pruefung-mcp
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Payload-Typen erzeugen
        run: pnpm generate:types

      - name: Typen und Import-Map müssen aktuell sein
        run: |
          pnpm generate:importmap
          if ! git diff --quiet; then
            echo "::error::Generierte Dateien sind veraltet — bitte 'pnpm generate:types' und 'pnpm generate:importmap' ausführen und mitcommitten."
            git diff --stat
            exit 1
          fi

      - name: Typprüfung
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Bauen
        run: pnpm build

      # NODE_ENV wie im Container: Ohne das steht der Postgres-Adapter auf
      # `push` — er gleicht das Schema dann selbst ab und überspringt die
      # Migrationen wortlos. Die Tabellen entstanden bisher nur beiläufig
      # beim Anlegen der Zugänge; wer die Migrationen prüfen will, prüfte
      # in Wahrheit gar nichts.
      - name: Datenbank migrieren
        run: pnpm migrate
        env:
          NODE_ENV: production

      - name: Browser für die Rauchtests
        run: pnpm exec playwright install --with-deps chromium

      # Hier bewusst *ohne* NODE_ENV=production, anders als beim Migrieren:
      # `payload run` braucht die Entwicklungswerkzeuge, um das TypeScript-
      # Skript überhaupt zu übersetzen. In Produktionsstellung endete der
      # Schritt nach zwei Sekunden ohne Ausgabe und ohne Zugänge. Dass das
      # Schema dabei zusätzlich abgeglichen wird, ist folgenlos — die
      # Migrationen sind einen Schritt vorher schon durchgelaufen.
      - name: Zugang für die Oberflächen-Prüfung anlegen
        run: pnpm benutzer
        env:
          ADMIN_PASSWORT: pruef-geheim-123
          VH_PASSWORT: pruef-geheim-123

      - name: Server starten
        run: |
          pnpm start &
          npx --yes wait-on http://localhost:3000/api/healthz --timeout 90000

      # Nachsehen, ob der Zugang wirklich steht. Ohne diese Probe scheitern
      # später alle Büro-Prüfungen an derselben Stelle, und im Protokoll
      # steht nur „Received: false" — die Ursache liegt dann Schritte vorher.
      - name: Prüfzugang nachmessen
        run: |
          code=$(curl -s -o /tmp/anmeldung.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/users/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d '{"email":"admin@vincent-hellmann.com","password":"pruef-geheim-123"}')
          if [ "$code" != "200" ]; then
            echo "::error::Der Prüfzugang meldet sich nicht an ($code) — siehe Schritt 'Zugang ... anlegen'."
            cat /tmp/anmeldung.json
            exit 1
          fi
          echo "Prüfzugang steht."

      - name: Rauchtests
        run: pnpm test
        env:
          ADMIN_TEST_PASSWORT: pruef-geheim-123
