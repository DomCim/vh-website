name: Prüfen (Typen, Lint, Build, Rauchtests)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vh
          POSTGRES_PASSWORD: vh
          POSTGRES_DB: vh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://vh:vh@localhost:5432/vh
      PAYLOAD_SECRET: nur-fuer-die-pruefung
      MCP_API_KEY: nur-fuer-die-pruefung-mcp
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Payload-Typen erzeugen
        run: pnpm generate:types

      - name: Typen und Import-Map müssen aktuell sein
        run: |
          pnpm generate:importmap
          if ! git diff --quiet; then
            echo "::error::Generierte Dateien sind veraltet — bitte 'pnpm generate:types' und 'pnpm generate:importmap' ausführen und mitcommitten."
            git diff --stat
            exit 1
          fi

      - name: Typprüfung
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Bauen
        run: pnpm build

      - name: Datenbank migrieren
        run: pnpm migrate

      - name: Browser für die Rauchtests
        run: pnpm exec playwright install --with-deps chromium

      # NODE_ENV bewusst gesetzt: Ohne das hält Payload den Lauf für
      # Entwicklung und gleicht das Schema selbst ab, statt sich auf die
      # Migrationen zu verlassen. Auf einer frisch migrierten Datenbank
      # endete das ohne eine Zeile Ausgabe — und ohne Zugänge.
      - name: Zugang für die Oberflächen-Prüfung anlegen
        run: pnpm benutzer
        env:
          NODE_ENV: production
          ADMIN_PASSWORT: pruef-geheim-123
          VH_PASSWORT: pruef-geheim-123

      - name: Server starten
        run: |
          pnpm start &
          npx --yes wait-on http://localhost:3000/api/healthz --timeout 90000

      # Nachsehen, ob der Zugang wirklich steht. Ohne diese Probe scheitern
      # später alle Büro-Prüfungen an derselben Stelle, und im Protokoll
      # steht nur „Received: false" — die Ursache liegt dann Schritte vorher.
      - name: Prüfzugang nachmessen
        run: |
          code=$(curl -s -o /tmp/anmeldung.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/users/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d '{"email":"admin@vincent-hellmann.com","password":"pruef-geheim-123"}')
          if [ "$code" != "200" ]; then
            echo "::error::Der Prüfzugang meldet sich nicht an ($code) — siehe Schritt 'Zugang ... anlegen'."
            cat /tmp/anmeldung.json
            exit 1
          fi
          echo "Prüfzugang steht."

      - name: Rauchtests
        run: pnpm test
        env:
          ADMIN_TEST_PASSWORT: pruef-geheim-123
