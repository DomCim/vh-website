name: Docker-Image bauen & veröffentlichen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ausrollen:
        description: 'Nach dem Bauen ausrollen? (greift nur auf main)'
        type: choice
        options: ['ja', 'nein']
        default: 'ja'
      alslatest:
        description: 'Auch als latest veröffentlichen? (sonst nur die Nummer)'
        type: choice
        options: ['nein', 'ja']
        default: 'nein'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Was hat sich überhaupt geändert? ───────────────────────────────────────
  #
  # Der Sinn der zwei Abbilder ist, dass eine Büro-Änderung den Shop nicht neu
  # startet. Das trägt aber nur, wenn dabei auch wirklich kein neues
  # Website-Abbild entsteht: Ein zweites `latest` mit neuer Prüfsumme reicht
  # schon, damit Docker den Container austauscht — selbst wenn inhaltlich
  # nichts anders wäre.
  #
  # Also wird vorher nachgesehen, welche Hälfte betroffen ist. Was beide
  # angeht (Datenmodell, Payload, `src/lib`, das Abbild selbst), baut beide.
  # Was keine von beiden angeht (Doku, Prüfungen, die Stack-Datei), baut
  # nichts.
  aenderungen:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.pruefen.outputs.web }}
      buero: ${{ steps.pruefen.outputs.buero }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Betroffene Hälften ermitteln
        id: pruefen
        run: |
          set -e
          vorher='${{ github.event.before }}'
          # Tags, Läufe von Hand und der allererste Push haben nichts zum
          # Vergleichen — dann wird beides gebaut.
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$vorher" ] \
             || [ "$vorher" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$vorher^{commit}" 2>/dev/null; then
            echo "Kein Vergleichspunkt — beide Abbilder werden gebaut."
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "buero=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          web=false
          buero=false
          geaendert=$(git diff --name-only "$vorher" "${{ github.sha }}")
          echo "Geänderte Dateien:"; echo "$geaendert" | sed 's/^/  /'

          while IFS= read -r datei; do
            [ -n "$datei" ] || continue
            case "$datei" in
              "src/app/(office)/"*|src/components/office/*)
                buero=true ;;
              "src/app/(frontend)/"*|"src/app/(payload)/"*|src/app/robots.ts|src/app/sitemap.ts)
                web=true ;;
              tests/*|playwright.config.ts|.github/workflows/ci.yml|*.md|docker-compose.yml|.env.example)
                # Ändert nichts an dem, was im Abbild landet
                ;;
              *)
                # Alles Übrige ist gemeinsamer Unterbau — im Zweifel beide
                web=true; buero=true ;;
            esac
          done <<< "$geaendert"

          echo "Website: $web, Büro: $buero"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "buero=$buero" >> "$GITHUB_OUTPUT"

  bauen:
    needs: aenderungen
    if: needs.aenderungen.outputs.web == 'true' || needs.aenderungen.outputs.buero == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Scheitert eine Hälfte, soll die andere trotzdem fertig werden — sonst
      # steht am Ende gar nichts Neues im Regal.
      fail-fast: false
      matrix:
        include:
          - rolle: web
            abbild: vh-website
          - rolle: buero
            abbild: vh-buero

    steps:
      - name: Übersprungen?
        id: dran
        run: |
          if [ "${{ matrix.rolle }}" = "web" ]; then
            noetig='${{ needs.aenderungen.outputs.web }}'
          else
            noetig='${{ needs.aenderungen.outputs.buero }}'
          fi
          echo "noetig=$noetig" >> "$GITHUB_OUTPUT"
          [ "$noetig" = "true" ] || echo "Nichts geändert — ${{ matrix.abbild }} bleibt, wie es ist."

      - name: Checkout
        if: steps.dran.outputs.noetig == 'true'
        uses: actions/checkout@v5

      - name: Docker Buildx einrichten
        if: steps.dran.outputs.noetig == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        if: steps.dran.outputs.noetig == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Von Hand angestoßen wird die Fassung gebaut, die in package.json steht.
      # Damit lässt sich ein bestimmter Stand veröffentlichen, ohne ihn vorher
      # auf main zu bringen und ohne einen Tag zu setzen — was etwa dann zählt,
      # wenn die Nummer nachher in den Portainer-Stack getippt wird.
      - name: Fassung aus package.json lesen
        if: steps.dran.outputs.noetig == 'true'
        id: fassung
        run: echo "nummer=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Image-Metadaten (Tags & Labels)
        if: steps.dran.outputs.noetig == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.abbild }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # Von Hand nur, wenn ausdrücklich gewollt: `latest` ist der Stand,
            # den der Stack zieht — ein Versuchsbau darf ihn nicht überschreiben.
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.alslatest == 'ja' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.fassung.outputs.nummer }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      - name: Bauen & pushen
        if: steps.dran.outputs.noetig == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keine Provenance-Beilage: Buildx schiebt sonst je Push ein
          # ungetaggtes Begleit-Manifest mit in die Registry. Die Dinger
          # zählen gegen den Paket-Speicher, und beim Aufräumen (unten) sind
          # sie eine Falle — wer sie einzeln löscht, zerreißt das getaggte
          # Abbild, zu dem sie gehören. Gebraucht hat sie hier nie jemand.
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            ROLLE=${{ matrix.rolle }}
          cache-from: type=gha,scope=${{ matrix.rolle }}
          cache-to: type=gha,mode=max,scope=${{ matrix.rolle }}

      # ── Alte Fassungen aufräumen ─────────────────────────────────────────
      #
      # Ohne das wächst die Registry mit jedem Release — und sobald die
      # Pakete privat sind, zählt jeder Stand gegen den Paket-Speicher
      # (2 GB bei GitHub Pro; die beiden Abbilder liegen zusammen schon bei
      # gut einem Gigabyte je Stand, geteilte Schichten mildern das nur).
      #
      # Behalten werden die zehn neuesten Versionen je Abbild. Das sind
      # großzügig gerechnet die letzten fünf Releases — mehr Stände zum
      # Zurückrollen (VH_FASSUNG im Stack) brauchte noch nie jemand. Zehn
      # statt fünf, weil aus der Zeit vor `provenance: false` noch
      # ungetaggte Begleit-Manifeste zwischen den echten Fassungen liegen
      # und mitzählen; die wandern so nach und nach von selbst hinaus.
      - name: Alte Fassungen aufräumen
        if: steps.dran.outputs.noetig == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.abbild }}
          package-type: container
          min-versions-to-keep: 10

  # ── Ausrollen ──────────────────────────────────────────────────────────────
  #
  # Ein eigener Auftrag, weil er genau einmal laufen darf. In der Matrix oben
  # liefe er je Hälfte einmal — der Betriebszeiger dürfte sich aber nur einmal
  # bewegen, sonst schöbe der zweite Lauf den ersten wieder zurück.
  #
  # `success` deckt auch den Fall ab, dass nur eine Hälfte gebaut und die
  # andere übersprungen wurde. Wurde gar nichts gebaut — etwa weil nur
  # Dokumentation geändert wurde —, steht dort `skipped`, und dann gibt es
  # auch nichts auszurollen.
  ausrollen:
    needs: [aenderungen, bauen]
    if: >-
      needs.bauen.result == 'success'
      && github.ref == 'refs/heads/main'
      && inputs.ausrollen != 'nein'
      && !contains(github.event.head_commit.message, '[kein-ausrollen]')
    runs-on: ubuntu-latest
    permissions:
      # Zum Weiterschieben des Betriebszeigers (Branch `betrieb`, siehe unten)
      contents: write
    steps:
      # Zwei Bremsen, weil es zwei Fälle gibt.
      #
      # Von Hand angestoßen: das Auswahlfeld oben. Beim Merge nach main lässt
      # sich dagegen nichts mitgeben — dort steht die Bremse im Text des
      # Commits. Wer `[kein-ausrollen]` in die Merge-Nachricht schreibt, baut
      # `latest`, ohne dass `betrieb` sich mitbewegt — Portainer sieht dann
      # keine Änderung und rollt nichts aus. Nachholen geht über einen
      # erneuten „Run workflow" auf demselben Stand, diesmal mit „ja".
      #
      # Beide Bremsen wirken nur auf `betrieb`, nicht auf das Abbild selbst:
      # `latest` wird oben (Auftrag `bauen`) unabhängig davon getaggt, sobald
      # von `main` gebaut wird. Wer den Portainer-Stack aus anderem Anlass von
      # Hand neu ausrollt, während ein zurückgehaltener Bau als `latest` in
      # der Registry liegt, holt sich damit genau diesen Bau — verfrüht und
      # ohne dass `betrieb` je bewegt wurde.

      # ── Der Betriebszeiger ─────────────────────────────────────────────
      #
      # Der Branch `betrieb` zeigt auf den Stand, den der Betrieb fahren
      # soll — Portainer pollt ihn (GitOps, Stack aus dem Repository) und
      # rollt bei jeder Bewegung neu aus, samt frischer Abbilder.
      #
      # Warum ein eigener Branch und nicht `main`: Portainer pollt das
      # **Repo**, gebaut werden die Abbilder aber erst **nach** dem Push.
      # Pollte Portainer `main`, käme es regelmäßig zwischen Push und
      # fertigem Bau — es zöge dann die alten Abbilder und bliebe darauf
      # stehen, weil sich das Repo danach nicht mehr rührt. Der Zeiger
      # bewegt sich deshalb erst hier, wenn beide Abbilder im Regal liegen.
      #
      # Kein neuer Commit, nur ein Zeiger: `betrieb` steht immer auf einem
      # Commit von `main`.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Betriebszeiger weiterschieben
        run: |
          git push --force origin "HEAD:refs/heads/betrieb"
          echo "betrieb steht jetzt auf ${GITHUB_SHA:0:7} — Portainer holt sich das beim nächsten Poll."
