name: Docker-Image bauen & veröffentlichen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Bauen & pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Der Portainer-Webhook ist nur im Heimnetz erreichbar. GitHub ruft
      # deshalb einen Cloud-Webhook von Home Assistant auf; der löst drinnen
      # das Neu-Ausrollen aus. Ohne hinterlegte Secrets wird der Schritt
      # übersprungen, der Build bleibt also auch ohne sie grün.
      - name: Ausrollen anstoßen (über Home Assistant)
        if: github.ref == 'refs/heads/main'
        env:
          HA_DEPLOY_WEBHOOK: ${{ secrets.HA_DEPLOY_WEBHOOK }}
          HA_DEPLOY_TOKEN: ${{ secrets.HA_DEPLOY_TOKEN }}
        run: |
          if [ -z "$HA_DEPLOY_WEBHOOK" ]; then
            echo "Kein Webhook hinterlegt — Ausrollen übersprungen."
            exit 0
          fi
          curl -fsS -X POST "$HA_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$HA_DEPLOY_TOKEN\",\"quelle\":\"github\",\"commit\":\"${GITHUB_SHA:0:7}\"}"
          echo "Ausrollen angestoßen."
